{% extends 'base.html' %}
{% load static %}

{% block content %}</br>
<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card">
        <div class="card-body">
          <form action="#" method="post">
            <fieldset>
              <legend>Contact Us</legend>
              <p>Have questions, feedback, or just want to say hello? Fill out the form below and we'll get back to you as soon as possible.</p>
              <div class="form-group">
                <label for="name">Name:</label><br>
                <input type="text" id="name" name="name" class="form-control" required><br>
              </div>
              <div class="form-group">
                <label for="email">Email:</label><br>
                <input type="email" id="email" name="email" class="form-control" required><br>
              </div>
              <div class="form-group">
                <label for="message">Message:</label><br>
                <textarea id="message" name="message" class="form-control" rows="4" required></textarea><br>
              </div>
              <button class="btn btn-primary" type="submit">Submit</button>
            </fieldset>
          </form>
        </div>
      </div>
    </div>
  </div>
</div></br>
{% endblock content %}
